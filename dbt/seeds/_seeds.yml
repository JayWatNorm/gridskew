seeds:
  - name: elexon_settlement_run_codes
    description: >
      One row per settlement-run code: ordered reference values for Elexon B1610
      settlement revisions.
    config:
      column_types:
        settlement_run_code: varchar(2)
        run_order: smallint

    columns:
      - name: settlement_run_code
        description: >
          Code received in the B1610 settlement_run_type field: II, SF, R1,
          R2, R3, RF or DF. DF is the dispute final run, made after RF to
          correct a settlement dispute.
        data_tests:
          - unique
          - not_null

      - name: run_order
        description: >
          Chronological revision order from the initial run to the final run.
        data_tests:
          - unique
          - not_null

  - name: elexon_fuel_codes
    description: >
      One row per published Elexon fuel-type code, with a broad group. The
      group describes the code, not a unit's measured fuel or emissions.

    config:
      column_types:
        fuel_code: varchar(16)
        code_group: varchar(32)

    columns:
      - name: fuel_code
        description: >
          Exact Elexon fuelType code. INTELE is retained because it is in the
          published reference list, although its meaning is not established.
        data_tests:
          - unique
          - not_null

      - name: code_group
        description: >
          Broad category of the code. Gas-turbine codes name the plant
          technology; unclassified keeps a code whose meaning is not established.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - bioenergy
                  - gas_turbine
                  - coal
                  - unclassified
                  - interconnector
                  - hydro
                  - nuclear
                  - oil
                  - other
                  - pumped_storage
                  - wind

sources: 
    - name: intensity
      description: Raw intensity data from the National Energy System Operator (NESO)
      database: gridskew_prod
      schema: raw
      loaded_at_field: retrieved_at

      tables:
       - name: carbon_intensity_outturn
         description: One row per settlement period, per poll. Actuals are null until settled and may be revised.
         freshness:
           warn_after: {count: 26, period: hour}
           error_after: {count: 48, period: hour}
         columns:
          - name: period_start
            description: start of a forecast window, part of key, never null
            tests:
             - not_null

          - name: period_end
            description: end of a forecast window, never null
            tests:
             - not_null            
          - name: retrieved_at
            description: datetime stamp popualted based on the pollers runtime, 
                         can be used to identify a run, never null, part of key.
            tests:
             - not_null
          - name: forecast_final
            description: The forecasted carbon intensity value, this is the near 
                         term forecast for the settlement period, proves to be close
                         to the actuals
            tests:
             - not_null
          - name: actual
            description: Actual values for the forecasted value, never null in the actuals
            tests: 
             - not_null

          - name: intensity_index
            description: Simple description of the carbon intensity, here it
                         describes the actual. never null. uncertainty around
                         this data due to potential band changes over time.
            tests:
             - accepted_values:
                arguments:
                 values: ['very high', 'high', 'moderate', 'low', 'very low']
             - not_null

       - name: carbon_intensity_forecast
         description: Next 48 hours worth of carbon intensity forecast data on each poll.
         freshness:
           warn_after: {count: 90, period: minute}
           error_after: {count: 180, period: minute}
         columns:
          - name: period_start
            description: start of a forecast window, part of key, never null.
            tests:
             - not_null

          - name: period_end
            description: end of a forecast window, never null.
            tests:
             - not_null            
          - name: retrieved_at
            description: datetime stamp populated based on the pollers runtime, 
                         can be used to identify a run, never null, part of key.
            tests:
             - not_null
          - name: forecast
            description: The forecasted carbon intensity value
                         for this settlement peroid, never null.
            tests:
             - not_null
          - name: actual
            description: Actual values for the forecasted value, always null in 
                         in the forecast data set.

          - name: intensity_index
            description: laymans description of the carbon intensity, here it
                         describes the forecast. never null. uncertainty around
                         this data due to potential band changes over time.
            tests:
             - accepted_values:
                arguments:
                 values: ['very high', 'high', 'moderate', 'low', 'very low']
             - not_null
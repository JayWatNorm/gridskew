        - settlement_date: '2026-03-29'
          settlement_period: 3
          period_start_utc: '2026-03-29 01:00:00+00'

        - settlement_date: '2026-03-29'
          settlement_period: 46
          period_start_utc: '2026-03-29 22:30:00+00'

        - settlement_date: '2026-03-29'
          settlement_period: 47
          period_start_utc: null

        - settlement_date: '2027-03-28'
          settlement_period: 46
          period_start_utc: '2027-03-28 22:30:00+00'

        - settlement_date: '2027-03-28'
          settlement_period: 47
          period_start_utc: null




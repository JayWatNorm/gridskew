            level_to: 0
            retrieved_at: '2026-01-15 01:00:00+00'

          - bm_unit: TEST_BMU
            national_grid_bm_unit: TEST_NG_BMU
            settlement_date: '2027-03-28'
            settlement_period: 46
            time_from: '2027-03-28 22:30:00+00'
            time_to: '2027-03-28 23:00:00+00'
            level_from: 0
            level_to: 0
            retrieved_at: '2027-03-28 23:30:00+00'

          - bm_unit: TEST_BMU
            national_grid_bm_unit: TEST_NG_BMU
            settlement_date: '2027-03-28'
            settlement_period: 47
            time_from: null
            time_to: null
            level_from: 0

sources:
  - name: elexon
    description: >
      Elexon Insights commitments (PN and QPN), metered volumes (B1610), and
      complete BM-unit registry observations.
      PN and QPN contain declared segments; B1610 contains settlement-period
      quantities. All tables are append-only.
    schema: raw
    loaded_at_field: retrieved_at

    tables:

      - name: elexon_bm_units_extracts
        description: >
          One committed manifest per complete BM-unit registry response.
          row_count counts source rows; unit_count counts distinct National
          Grid BM-unit IDs. Only a successful full response gets a manifest.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: extract_id
            data_tests: [unique, not_null]
          - name: retrieved_at
            description: UTC observation time, not a source effective date.
          - name: row_count
            description: Number of raw source rows in this complete extract.
          - name: unit_count
            description: Number of distinct National Grid BM-unit IDs.

      - name: elexon_bm_units
        description: >
          Every row from each committed full registry response. One unit may
          have multiple source rows with different EICs; source_index retains
          the exact response grain.
        columns:
          - name: extract_id
            description: Complete response identifier.
          - name: source_index
            description: Zero-based source position within the response.
          - name: national_grid_bm_unit
            description: Nonblank unit identifier, not unique in raw extracts.
          - name: elexon_bm_unit
            description: Nullable Elexon identifier.
          - name: eic
            description: Nullable EIC; one unit can have more than one.
          - name: fuel_type
            description: Nullable source fuel code; never inferred.

      # ------------------------------------------------------------------
      - name: elexon_pn
        description: >
          Physical Notifications — what each unit said it would export or
          import.
          Check against QPN, which declares an underlying-process MW quantity
          netted off this figure to establish the operating level to which
          Dynamic Data apply. QPN is not used in Settlement, so downstream
          shortfall models compare integrated PN MWh with B1610 MWh without
          subtracting QPN.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:

          - name: bm_unit
            description: >
              Elexon identifier for the unit. Nullable here, and null on
              1.4% of rows — units known to National Grid but not registered
              with Elexon. This is the identifier B1610 keys on.

          - name: national_grid_bm_unit
            description: National Grid identifier. Never null. Part of the key.

          - name: settlement_date
            description: >
              British local time, no timezone attached. Never derive this
              from time_from — it is wrong for an hour of every summer day.

          - name: settlement_period
            description: >
              Half-hour window within the settlement date. Normally 1–48;
              clock-change days have 46 or 50.

          - name: time_from
            description: >
              Segment start, UTC. Segments can be shorter than a settlement
              period to describe a ramp. Part of the key.
            tests:
              - not_null

          - name: time_to
            description: Segment end, UTC.
            tests:
              - not_null

          - name: level_from
            description: >
              MW at time_from. The value moves in a straight line to
              level_to across the segment; it is not an average.

          - name: level_to
            description: MW at time_to. See level_from.

          - name: retrieved_at
            description: >
              When this poll ran. Part of the key, so a re-poll of the same
              window lands as new rows rather than conflicting — which is
              what makes a resubmitted notification visible.

      # ------------------------------------------------------------------
      - name: elexon_qpn
        description: >
          Quiescent Physical Notifications — an underlying process quantity
          deducted from PN to establish the operating level to which Dynamic
          Data apply. Optional, and almost always zero: in the completed
          2025-08-22 to 2026-08-23 backfill, 18,300 of 41.5M rows are non-zero,
          all belonging to one unit.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:

          - name: bm_unit
            description: >
              Elexon identifier. Nullable, and null on exactly the same rows
              as in PN. This is the identifier B1610 keys on.

          - name: national_grid_bm_unit
            description: National Grid identifier. Never null. Part of the key.

          - name: settlement_date
            description: >
              British local time, no timezone attached. Never derive this
              from time_from.

          - name: settlement_period
            description: >
              Half-hour window within the settlement date. Normally 1–48;
              clock-change days have 46 or 50.

          - name: time_from
            description: >
              Segment start, UTC. QPN segment boundaries are independent of
              PN's — the two cannot be joined row to row. Part of the key.
            tests:
              - not_null

          - name: time_to
            description: Segment end, UTC.
            tests:
              - not_null

          - name: level_from
            description: MW to deduct at time_from.

          - name: level_to
            description: MW to deduct at time_to.

          - name: retrieved_at
            description: When this poll ran. Part of the key.

      # ------------------------------------------------------------------
      - name: elexon_b1610
        description: >
          Metered export or import energy per unit and settlement period — the
          receipt against PN's promise. Published after five working days,
          normally seven calendar days and sometimes about twelve around bank
          holidays. The poller uses a 14-day offset. Later settlement runs
          arrive as new rows under different settlement_run_type values.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:

          - name: bm_unit
            description: >
              Elexon identifier. Never null here, which is why this table
              keys on it — the inverse of PN and QPN. Part of the key.

          - name: national_grid_bm_unit_id
            description: >
              National Grid identifier. Null on 71.8% of rows, because this
              dataset meters embedded and secondary units that have no
              National Grid registration. Note the Id suffix, which PN and
              QPN do not have.

          - name: psr_type
            description: Resource type. Only Generation observed to date.
            tests:
              - accepted_values:
                  arguments:
                    values: ['Generation']
              - not_null

          - name: settlement_date
            description: >
              British local time, no timezone attached. Never derive this
              from half_hour_end_time. Part of the key.

          - name: settlement_period
            description: >
              Half-hour window within the settlement date. Normally 1–48;
              clock-change days have 46 or 50. Part of the key.

          - name: half_hour_end_time
            description: >
              Period END, UTC — naive in the source, unlike PN's time_from.
              Will not align with PN and QPN segment boundaries, which split
              within a period.

          - name: settlement_run_type
            description: >
              Which settlement run produced this quantity, in order
              II, SF, R1, R2, R3, RF. Each supersedes the last. Part of the
              key, so a revision lands as a new row. Not filterable in
              practice — the API serves only the run currently in force, so
              which run you receive is decided by the poll offset.

          - name: quantity
            description: >
              MWh for the whole period, not MW. Negative for units that
              consume. Numeric rather than float because these get summed.

          - name: retrieved_at
            description: >
              When this settlement run was first seen. Deliberately NOT part
              of the key here — a re-poll finding no new run inserts nothing,
              which makes re-polls idempotent and absorbs the one period of
              overlap between consecutive daily chunks.

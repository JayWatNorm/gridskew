sources:
  - name: elexon
    description: >
      Elexon Insights commitments (PN and QPN), metered volumes (B1610), and
      complete BM-unit registry observations.
      PN and QPN contain declared segments; B1610 contains settlement-period
      quantities. All tables are append-only.
    schema: raw
    loaded_at_field: retrieved_at

    tables:

      - name: elexon_bm_units_extracts
        description: >
          One committed manifest per complete BM-unit registry response.
          row_count counts source rows; unit_count counts distinct National
          Grid BM-unit IDs. Only a successful full response gets a manifest.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: extract_id
            data_tests: [unique, not_null]
          - name: retrieved_at
            description: UTC observation time, not a source effective date.
          - name: row_count
            description: Number of raw source rows in this complete extract.
          - name: unit_count
            description: Number of distinct National Grid BM-unit IDs.

      - name: elexon_bm_units
        description: >
          Every row from each committed full registry response. One unit may
          have multiple source rows with different EICs; source_index retains
          the exact response grain.
        columns:
          - name: extract_id
            description: Complete response identifier.
          - name: source_index
            description: Zero-based source position within the response.
          - name: national_grid_bm_unit
            description: Nonblank unit identifier, not unique in raw extracts.
          - name: elexon_bm_unit
            description: Nullable Elexon identifier.
          - name: eic
            description: Nullable EIC; one unit can have more than one.
          - name: fuel_type
            description: Nullable source fuel code; never inferred.

      # ------------------------------------------------------------------
      - name: elexon_pn
        description: >
          Physical Notifications — what each unit said it would export or
          import.
          Check against QPN, which declares an underlying-process MW quantity
          netted off this figure to establish the operating level to which
          Dynamic Data apply. QPN is not used in Settlement, so downstream
          shortfall models compare integrated PN MWh with B1610 MWh without
          subtracting QPN.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:

          - name: bm_unit
            description: >
              Elexon identifier for the unit. Nullable here, and null on
              1.4% of rows — units known to National Grid but not registered
              with Elexon. This is the identifier B1610 keys on.

          - name: national_grid_bm_unit
            description: National Grid identifier. Never null. Part of the key.

          - name: settlement_date
            description: >
              British local time, no timezone attached. Never derive this
              from time_from — it is wrong for an hour of every summer day.

          - name: settlement_period
            description: >
              Half-hour window within the settlement date. Normally 1–48;
              clock-change days have 46 or 50.

          - name: time_from
            description: >
              Segment start, UTC. Segments can be shorter than a settlement
              period to describe a ramp. Part of the key.
            tests:
              - not_null

          - name: time_to
            description: Segment end, UTC.
            tests:
              - not_null

          - name: level_from
            description: >
              MW at time_from. The value moves in a straight line to
              level_to across the segment; it is not an average.

          - name: level_to
            description: MW at time_to. See level_from.

          - name: retrieved_at
            description: >
              When this poll ran. Part of the key, so a re-poll of the same
              window lands as new rows rather than conflicting — which is
              what makes a resubmitted notification visible.

      # ------------------------------------------------------------------
      - name: elexon_qpn
        description: >
          Quiescent Physical Notifications — an underlying process quantity
          deducted from PN to establish the operating level to which Dynamic
          Data apply. Optional, and almost always zero: in the completed
          2025-08-22 to 2026-08-23 backfill, 18,300 of 41.5M rows are non-zero,
          all belonging to one unit.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:

          - name: bm_unit
            description: >
              Elexon identifier. Nullable, and null on exactly the same rows
              as in PN. This is the identifier B1610 keys on.

          - name: national_grid_bm_unit
            description: National Grid identifier. Never null. Part of the key.

          - name: settlement_date
            description: >
              British local time, no timezone attached. Never derive this
              from time_from.

          - name: settlement_period
            description: >
              Half-hour window within the settlement date. Normally 1–48;
              clock-change days have 46 or 50.

          - name: time_from
            description: >
              Segment start, UTC. QPN segment boundaries are independent of
              PN's — the two cannot be joined row to row. Part of the key.
            tests:
              - not_null

          - name: time_to
            description: Segment end, UTC.
            tests:
              - not_null

          - name: level_from
            description: MW to deduct at time_from.

          - name: level_to
            description: MW to deduct at time_to.

          - name: retrieved_at
            description: When this poll ran. Part of the key.

      # ------------------------------------------------------------------
      - name: elexon_boalf
        description: >
          Bid-offer acceptance levels: the MW level the system operator
          instructed a unit to follow, as ramp points. One row per unit,
          acceptance, ramp point and poll. A daily poll returns the ramp
          points that start in its UTC day, both ends included, so an
          acceptance that crosses midnight is spread over two polls and its
          midnight point is in both.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:

          - name: national_grid_bm_unit
            description: National Grid identifier. Never null. Part of the key.

          - name: bm_unit
            description: Elexon identifier. Nullable in the contract, as in PN.

          - name: acceptance_number
            description: >
              Identifies an acceptance for one unit. Part of the key. Not
              unique on its own: two units can hold the same number.

          - name: acceptance_time
            description: When the system operator issued the acceptance, UTC.

          - name: settlement_date
            description: >
              British local time, for the period the ramp point starts in.
              Never derive this from time_from.

          - name: settlement_period_from
            description: Settlement period the ramp point starts in.

          - name: settlement_period_to
            description: >
              Settlement period the ramp point ends in. Differs from
              settlement_period_from on about a fifth of rows.

          - name: time_from
            description: Ramp point start, UTC. Part of the key.

          - name: time_to
            description: Ramp point end, UTC.

          - name: level_from
            description: >
              MW at time_from: an absolute level, not a change from the
              notified level. A straight line to level_to.

          - name: level_to
            description: MW at time_to. See level_from.

          - name: so_flag
            description: >
              Believed to mark an action taken for system reasons, not to
              balance energy. The API does not document it.

          - name: deemed_bo_flag
            description: Deemed bid-offer flag. Only false observed.

          - name: stor_flag
            description: >
              Short Term Operating Reserve flag. Observed with one value for
              every row of a day: true on 28 and 29 March 2026, false on the
              other days checked.

          - name: rr_flag
            description: Replacement Reserve flag. Only false observed.

          - name: amendment_flag
            description: >
              Only ORI observed. A warning test on the staging model reports
              any other value, because the by-period model assumes that a
              ramp point is never withdrawn.

          - name: retrieved_at
            description: When this poll ran. Part of the key.

      # ------------------------------------------------------------------
      - name: elexon_remit
        description: >
          REMIT messages: outage and availability notices that market
          participants publish. One row per publication of a message. A
          notice is revised by publishing it again; every publication is
          kept. Fields with no column here, such as the outage profile, are
          in payload.
        loaded_at_field: publish_time
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        columns:

          - name: mrid
            description: >
              Message identifier, shared by every revision of one notice.
              Part of the key.

          - name: revision_number
            description: >
              Part of the key. Not unique within an mrid: one number can be
              published more than once with different content.

          - name: publish_time
            description: >
              When Elexon published this row, UTC. Part of the key. The
              poller's window and the freshness check both use it.

          - name: created_time
            description: >
              The creation time the source gives this row, UTC. Part of the
              key. It can be later than publish_time.

          - name: message_type
            description: >
              UnavailabilitiesOfElectricityFacilities or
              OtherMarketInformation observed.

          - name: event_type
            description: >
              Production, Consumption, Transmission or Other unavailability
              observed. Null on OtherMarketInformation messages.

          - name: unavailability_type
            description: >
              Planned or Unplanned observed; the API does not list the
              values. Null on OtherMarketInformation messages.

          - name: event_status
            description: Active, Inactive or Dismissed observed.

          - name: asset_id
            description: >
              Usually an Elexon BM-unit identifier, but free text: values
              such as NO_ASSET occur.

          - name: affected_unit
            description: >
              Usually the National Grid form of the unit identifier, but
              free text.

          - name: fuel_type
            description: Free text such as Fossil Gas; null on about a quarter.

          - name: normal_capacity
            description: >
              MW when fully available, as published. Can be fractional or
              negative.

          - name: available_capacity
            description: MW still available during the event.

          - name: unavailable_capacity
            description: >
              MW lost. Not always normal_capacity minus available_capacity.

          - name: event_start_time
            description: Start of the event, UTC.

          - name: event_end_time
            description: End of the event, UTC. Later revisions often move it.

          - name: payload
            description: The complete source row.

          - name: retrieved_at
            description: >
              When the poll that first stored this row ran. Not part of the
              key: a repeated read of one publication inserts nothing.

      # ------------------------------------------------------------------
      - name: elexon_b1610
        description: >
          Metered export or import energy per unit and settlement period — the
          receipt against PN's promise. Published after five working days,
          normally seven calendar days and sometimes about twelve around bank
          holidays. The poller uses a 14-day offset. Later settlement runs
          arrive as new rows under different settlement_run_type values.
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 48, period: hour}
        columns:

          - name: bm_unit
            description: >
              Elexon identifier. Never null here, which is why this table
              keys on it — the inverse of PN and QPN. Part of the key.

          - name: national_grid_bm_unit_id
            description: >
              National Grid identifier. Null on 71.8% of rows, because this
              dataset meters embedded and secondary units that have no
              National Grid registration. Note the Id suffix, which PN and
              QPN do not have.

          - name: psr_type
            description: Resource type. Only Generation observed to date.
            tests:
              - accepted_values:
                  arguments:
                    values: ['Generation']
              - not_null

          - name: settlement_date
            description: >
              British local time, no timezone attached. Never derive this
              from half_hour_end_time. Part of the key.

          - name: settlement_period
            description: >
              Half-hour window within the settlement date. Normally 1–48;
              clock-change days have 46 or 50. Part of the key.

          - name: half_hour_end_time
            description: >
              Period END, UTC — naive in the source, unlike PN's time_from.
              Will not align with PN and QPN segment boundaries, which split
              within a period.

          - name: settlement_run_type
            description: >
              Which settlement run produced this quantity, in order
              II, SF, R1, R2, R3, RF. Each supersedes the last. Part of the
              key, so a revision lands as a new row. The API serves only the
              run currently in force, so the poll offset decides which run
              exists; a request for a superseded run returns nothing.

          - name: quantity
            description: >
              MWh for the whole period, not MW. Negative for units that
              consume. Numeric rather than float because these get summed.

          - name: retrieved_at
            description: >
              When this settlement run was first seen. Deliberately NOT part
              of the key here — a re-poll finding no new run inserts nothing,
              which makes re-polls idempotent and a repeated capture safe.

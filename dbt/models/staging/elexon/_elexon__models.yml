models:
  - name: stg_elexon__bm_units
    description: >
      One row per complete registry extract and source position. This view
      preserves every source row, including multiple EICs for one BM unit.
      retrieved_at is observation time, not the source effective date.
    columns:
      - name: extract_id
        data_tests: [not_null]
      - name: source_index
        data_tests: [not_null]
      - name: national_grid_bm_unit
        data_tests: [not_null]
      - name: fuel_type
        description: Nullable published fuel code; null remains unknown.
      - name: demand_capacity_mw
        description: Source string converted to numeric MW; blanks become null.
      - name: generation_capacity_mw
        description: Source string converted to numeric MW; blanks become null.

  - name: stg_elexon__b1610
    description: >
      One row per BM unit, settlement period and settlement run, containing
      metered import or export energy. Every captured settlement run is retained
      so revisions remain visible.
    columns:
      - name: bm_unit
        description: >
          Elexon identifier. Never null here, which is why this table
          keys on it — the inverse of PN and QPN. Part of the key
      - name: national_grid_bm_unit_id
        description: >
          National Grid identifier. Null on 71.8% of rows, because this
          dataset meters embedded and secondary units that have no
          National Grid registration. Note the Id suffix, which PN and
          QPN do not have
      - name: psr_type
        description: Resource type. Only Generation observed to date
      - name: settlement_date
        description: >
          British local time, no timezone attached. Never derive this
          from half_hour_end_time. Part of the key
      - name: settlement_period
        description: >
          Half-hour window within the settlement date. Normally 1–48;
          clock-change days have 46 or 50. Part of the key
      - name: period_start_utc
        description: >
          UTC start of the settlement period, calculated from settlement_date
          and settlement_period by the settlement_period_start_utc macro. The
          settlement date is interpreted in Europe/London, preserving the
          correct period sequence across clock-change days.
      - name: half_hour_end_time
        description: >
          Period END, UTC — naive in the source, unlike PN's time_from.
          Will not align with PN and QPN segment boundaries, which split
          within a period
      - name: settlement_run_type
        description: >
          Which settlement run produced this quantity, in order
          II, SF, R1, R2, R3, RF. Each supersedes the last. Part of the
          key, so a revision lands as a new row. The API serves only the
          run currently in force, so the poll offset decides which run
          exists; a request for a superseded run returns nothing.
          S6 blocking check: every code must exist in the settlement-run seed,
          so an unknown run stops the build before the facts. NOT NULL is
          enforced by the raw table, so no separate null test.
        data_tests:
          - relationships:
              arguments:
                to: ref('elexon_settlement_run_codes')
                field: settlement_run_code
      - name: quantity
        description: >
          MWh for the whole period, not MW. Negative for units that
          consume. Numeric rather than float because these get summed
      - name: retrieved_at
        description: >
          When this settlement run was first seen. Deliberately NOT part
          of the key here — a re-poll finding no new run inserts nothing,
          which makes re-polls idempotent and a repeated capture safe.
  - name: stg_elexon__boalf
    description: >
      One row per unit, acceptance, ramp point and poll. Each ramp point is a
      straight MW line the system operator instructed the unit to follow.
      Every poll is retained, so the midnight ramp point of an acceptance
      that crosses midnight appears once for each of the two daily polls.
    columns:
      - name: national_grid_bm_unit
        description: National Grid identifier. Never null. Part of the key
      - name: bm_unit
        description: Elexon identifier. This is the identifier B1610 keys on
      - name: acceptance_number
        description: >
          Identifies an acceptance for one unit. Two units can hold the same
          number. Part of the key
      - name: acceptance_time
        description: When the system operator issued the acceptance, UTC
      - name: settlement_date
        description: >
          British local time, for the period the ramp point starts in. Never
          derive this from time_from
      - name: settlement_period_from
        description: Settlement period the ramp point starts in
      - name: settlement_period_to
        description: Settlement period the ramp point ends in
      - name: time_from
        description: Ramp point start, UTC. Part of the key
      - name: time_to
        description: Ramp point end, UTC
      - name: level_from
        description: >
          MW at time_from: an absolute level, not a change from the notified
          level. The value moves in a straight line to level_to
      - name: level_to
        description: MW at time_to. See level_from
      - name: so_flag
        description: >
          Believed to mark an action taken for system reasons. The API does
          not document it
      - name: amendment_flag
        description: >
          Only ORI observed. The by-period model keeps the latest capture of
          each ramp point and assumes that none is withdrawn; another value
          here means that assumption needs checking.
        data_tests:
          - accepted_values:
              arguments:
                values: ['ORI']
              config:
                severity: warn
      - name: retrieved_at
        description: When this poll ran. Part of the key.
  - name: stg_elexon__qpn
    description: >
      One row per declared QPN segment, per unit, per poll. QPN segment
      boundaries are independent of PN. Zero is valid; a missing row means
      that the unit did not submit a QPN.
    columns:
      - name: bm_unit
        description: >
          Elexon identifier. Nullable, and null on exactly the same rows
          as in PN. This is the identifier B1610 keys on
      - name: national_grid_bm_unit
        description: National Grid identifier. Never null. Part of the key
      - name: settlement_date
        description: >
          British local time, no timezone attached. Never derive this
          from time_from
      - name: settlement_period
        description: >
          Half-hour window within the settlement date. Normally 1–48;
          clock-change days have 46 or 50
      - name: period_start_utc
        description: >
          UTC start of the settlement period, calculated from settlement_date
          and settlement_period by the settlement_period_start_utc macro. The
          settlement date is interpreted in Europe/London, preserving the
          correct period sequence across clock-change days.
      - name: time_from
        description: >
          Segment start, UTC. QPN segment boundaries are independent of
          PN's — the two cannot be joined row to row. Part of the key
      - name: time_to
        description: Segment end, UTC
      - name: level_from
        description: MW to deduct at time_from
      - name: level_to
        description: MW to deduct at time_to
      - name: retrieved_at
        description: When this poll ran. Part of the key.
  - name: stg_elexon__pn
    description: >
      One row per declared PN segment, per unit, per poll. Segment endpoints
      describe a linear MW ramp, and every poll is retained so resubmissions
      remain visible.
    columns:
      - name: bm_unit
        description: >
          Elexon identifier for the unit. Nullable here, and null on
          1.4% of rows — units known to National Grid but not registered
          with Elexon. This is the identifier B1610 keys on
      - name: national_grid_bm_unit
        description: National Grid identifier. Never null. Part of the key
      - name: settlement_date
        description: >
          British local time, no timezone attached. Never derive this
          from time_from — it is wrong for an hour of every summer day
      - name: settlement_period
        description: >
          Half-hour window within the settlement date. Normally 1–48;
          clock-change days have 46 or 50
      - name: period_start_utc
        description: >
          UTC start of the settlement period, calculated from settlement_date
          and settlement_period by the settlement_period_start_utc macro. The
          settlement date is interpreted in Europe/London, preserving the
          correct period sequence across clock-change days.
      - name: time_from
        description: >
          Segment start, UTC. Segments can be shorter than a settlement
          period to describe a ramp. Part of the key.
        tests:
          - not_null
      - name: time_to
        description: Segment end, UTC.
        tests:
          - not_null
      - name: level_from
        description: >
          MW at time_from. The value moves in a straight line to
          level_to across the segment; it is not an average
      - name: level_to
        description: MW at time_to. See level_from
      - name: retrieved_at
        description: >
          When this poll ran. Part of the key, so a re-poll of the same
          window lands as new rows rather than conflicting — which is
          what makes a resubmitted notification visible.

  - name: stg_elexon__remit
    description: >
      One row per publication of a REMIT message. A notice is revised by
      publishing it again. One revision number can be published more than
      once, and revision_number does not always rise with publish_time, so
      this model does not choose the current row of a notice.
    columns:
      - name: mrid
        description: Message identifier, shared by every revision. Part of the key
      - name: revision_number
        description: Part of the key. Not unique within an mrid
      - name: publish_time
        description: When Elexon published this row, UTC. Part of the key
      - name: created_time
        description: The creation time the source gives this row, UTC. Part of the key
      - name: unavailability_type
        description: >
          Planned or Unplanned observed. Null on OtherMarketInformation
          messages
      - name: asset_id
        description: Usually an Elexon BM-unit identifier, but free text
      - name: outage_profile
        description: >
          The optional MW profile of the event as a JSON array of startTime,
          endTime and capacity, as published. Null on about three quarters of
          rows

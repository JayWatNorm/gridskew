groups:
  - name: elexon_facts
    owner:
      name: James
    description: >
      Period facts and the private intermediate tables that prepare them.
      A model outside this group cannot reference the private tables; it
      reads them through the protected mapped views
      (int_elexon__b1610_period_mapped, int_elexon__pn_period_mapped), which
      add the registry mapping.

  - name: analysis
    owner:
      name: James
    description: >
      Private intermediate models that prepare the research questions, and the
      analyses that read them. The carbon models hold forecast drift and
      forecast error; a result is read only through its recorded reading rule.

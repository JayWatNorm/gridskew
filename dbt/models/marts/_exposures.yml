exposures:
  - name: gridskew_results_page
    type: analysis
    url: https://jaywatnorm.github.io/gridskew
    owner:
      name: GridSkew
    description: >
      The results page. Its Q3 and Q12 figures come from
      agg_delivery_by_fuel_group through the analyses that read it, and its
      cohort coverage from agg_generation_coverage.
    depends_on:
      - ref('agg_delivery_by_fuel_group')
      - ref('agg_generation_coverage')

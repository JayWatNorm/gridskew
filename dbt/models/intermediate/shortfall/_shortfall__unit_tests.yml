          Q3,2026-01-15,21,2026-01-15 10:00:00+00,50,complete,mapped,2026-01-16 00:00:00+00,2026-01-16 00:00:00+00
          Q4,2026-01-14,21,2026-01-14 10:00:00+00,30,complete,mapped,2026-01-16 00:00:00+00,2026-01-16 00:00:00+00
          Q4,2026-01-14,22,2026-01-14 10:30:00+00,30,complete,mapped,2026-01-16 00:00:00+00,2026-01-16 00:00:00+00
      - input: ref('stg_elexon__pn')
        format: csv
        rows: |
          national_grid_bm_unit,settlement_date,settlement_period,period_start_utc,time_from,time_to,level_from,level_to,retrieved_at
      - input: ref('int_elexon__b1610_period_mapped')

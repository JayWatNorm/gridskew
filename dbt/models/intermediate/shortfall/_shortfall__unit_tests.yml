  - name: test_shortfall_absvd_latest_capture_per_unit_period
    description: >
      QAS for 14 January was captured twice (16 and 30 January); 15 January
      never. Q1 period 21 takes the later value (4.125), and period 22 the
      later of two values (6.5). Q4 period 22 is only in the earlier capture
      and keeps it (-1.25); Q4 period 21 is in both, unchanged. Q2 has no row
      in either capture of a captured date: 0. Q3's date was never captured:
      null, and so is unexplained_after_absvd_mwh. Q2 period 22 has no
      metered value, so ABSVD is 0 but nothing is left to explain.
      unexplained_after_absvd_mwh adds ABSVD to the unexplained energy, as
      Settlement adds QAS to the expected volume. Rows of the 14th carry the
      date's latest capture time.
    model: int_shortfall_by_unit_period
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_elexon__bm_unit_cohort')
        format: csv
        rows: |
          national_grid_bm_unit,elexon_bm_unit,fuel_type,fuel_group
          Q1,T_Q1,PS,other
          Q2,T_Q2,PS,other
          Q3,T_Q3,PS,other
          Q4,T_Q4,CCGT,gas_turbine
      - input: ref('int_elexon__pn_period_mapped')
        format: csv
        rows: |
          national_grid_bm_unit,settlement_date,settlement_period,period_start_utc,pn_mwh,coverage_status,mapping_status,pn_retrieved_at,last_captured_at

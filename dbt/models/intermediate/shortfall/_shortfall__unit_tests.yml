unit_tests:
  - name: test_instruction_intervals_latest_acceptance_wins_its_minutes
    description: >
      UNIT-1 has acceptance 1 (time 09:00) at a flat 20 MW for the whole
      half-hour and acceptance 2 (time 08:55, as published data sometimes
      shows) at a flat 60 MW for its last 15 minutes. The higher number is
      the later acceptance whatever its time, so acceptance 2 wins only the
      minutes it covers: 10:00 to
      10:15 stay with acceptance 1 (5 MWh) and 10:15 to 10:30 go to
      acceptance 2 (15 MWh). UNIT-2's single acceptance covers 10:10 to
      10:20 at 30 MW (5 MWh) and the rest of its half-hour has no row.
    model: int_elexon__instruction_intervals
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_elexon__boalf')
        format: csv
        rows: |
          national_grid_bm_unit,bm_unit,acceptance_number,acceptance_time,time_from,time_to,level_from,level_to,so_flag,retrieved_at
          UNIT-1,T_UNIT-1,1,2026-01-15 09:00:00+00,2026-01-15 10:00:00+00,2026-01-15 10:30:00+00,20,20,false,2026-01-16 00:00:00+00
          UNIT-1,T_UNIT-1,2,2026-01-15 08:55:00+00,2026-01-15 10:15:00+00,2026-01-15 10:30:00+00,60,60,true,2026-01-16 00:00:00+00
          UNIT-2,T_UNIT-2,3,2026-01-15 09:00:00+00,2026-01-15 10:10:00+00,2026-01-15 10:20:00+00,30,30,false,2026-01-16 00:00:00+00
    expect:
      format: csv
      rows: |
        national_grid_bm_unit,period_start_utc,interval_from,interval_to,acceptance_number,so_flag,instructed_mwh
        UNIT-1,2026-01-15 10:00:00+00,2026-01-15 10:00:00+00,2026-01-15 10:15:00+00,1,false,5.000000
        UNIT-1,2026-01-15 10:00:00+00,2026-01-15 10:15:00+00,2026-01-15 10:30:00+00,2,true,15.000000
        UNIT-2,2026-01-15 10:00:00+00,2026-01-15 10:10:00+00,2026-01-15 10:20:00+00,3,false,5.000000

  - name: test_shortfall_expected_output_rules
    description: >
      A: uninstructed uses the PN (shortfall 5). B: an acceptance in force
      for the last 15 minutes replaces the PN for those minutes only, so the
      expected energy is 25 of PN plus 15 instructed = 40 (shortfall 10,
      deviation from PN 20, instructed deviation 10). C: no metered value is
      labelled. D: an incomplete PN with no acceptance is labelled. F: two
      metered rows for one period are reported, not summed. G: an acceptance
      covering the whole half-hour makes the period determinable even though
      its PN is incomplete. H: a PN capture with a segment of no duration is
      invalid; its acceptance does not cover the half-hour, so the period is
      labelled and nothing divides by zero. J: a complete PN whose mapping is
      a conflict is not used, so B's acceptance pattern gives no expected
      value and the period is labelled pn_conflict. A unit outside the
      cohort has no row.
    model: int_shortfall_by_unit_period
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_elexon__bm_unit_cohort')
        format: csv
        rows: |
          national_grid_bm_unit,elexon_bm_unit,fuel_type,fuel_group
          A,T_A,CCGT,gas_turbine
          B,T_B,CCGT,gas_turbine
          C,T_C,WIND,wind
          D,T_D,WIND,wind
          F,T_F,NUCLEAR,nuclear
          G,T_G,WIND,wind
          H,T_H,WIND,wind
          J,T_J,CCGT,gas_turbine
      - input: ref('int_elexon__pn_period_mapped')

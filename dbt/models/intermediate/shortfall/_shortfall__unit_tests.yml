          T_Q1,2026-01-13,21,2026-01-13 10:00:00+00,mapped,Q1,45,SF,2026-01-10 00:00:00+00,45,SF,2026-01-10 00:00:00+00
          T_Q1,2026-01-14,21,2026-01-14 10:00:00+00,mapped,Q1,45,SF,2026-01-10 00:00:00+00,45,SF,2026-01-10 00:00:00+00

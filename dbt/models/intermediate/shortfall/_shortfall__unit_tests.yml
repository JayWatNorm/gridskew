          Q1,2026-01-14,22,2026-01-14 10:30:00+00,40,complete,mapped,2026-01-16 00:00:00+00,2026-01-16 00:00:00+00
          Q2,2026-01-14,21,2026-01-14 10:00:00+00,50,complete,mapped,2026-01-16 00:00:00+00,2026-01-16 00:00:00+00

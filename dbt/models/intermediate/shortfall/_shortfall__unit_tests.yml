  - name: test_shortfall_new_qas_capture_touches_its_whole_date
    description: >
      Incremental run with the watermark at 20 January (the margin is three
      days). Nothing but QAS changed since: a capture of 14 January at
      30 January touches every cohort unit-period of that date, Q2's with 0;
      13 January's capture of 12 January is older than the margin, so its
      rows are not rebuilt. The expected rows are the batch the run inserts.
    model: int_shortfall_by_unit_period
    overrides:
      macros:
        is_incremental: true
        capture_watermark: "'2026-01-20 00:00:00+00'::timestamptz"
        changed_cohort_units: []
    given:
      # The run reads the stored table only through the two overridden macros.
      # SQL, not CSV: a CSV input reads its column types from the table, which
      # a fresh CI database does not have when unit tests run.
      - input: this
        format: sql
        rows: |
          select
              'Q1'::text as national_grid_bm_unit,
              '2026-01-14'::date as settlement_date,
              21 as settlement_period,
              '2026-01-10 00:00:00+00'::timestamptz as last_captured_at

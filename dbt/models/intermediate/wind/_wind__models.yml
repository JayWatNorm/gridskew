models:
  - name: int_wind_error_by_period
    description: >
      One row per half-hour with a FUELHH wind outturn: the outturn's first
      publication, the latest WINDFOR issue published strictly before the
      half-hour starts, and that issue's hourly point for the hour containing
      the half-hour's start (both halves of an hour share it; no
      interpolation). If the latest issue holds no point for the hour, the
      forecast is null; an older issue is never used in its place. WINDFOR
      covers metered wind; FUELHH is taken to (inferred). The cohort wind
      curtailment add-back is computed in the Q30 analysis
      (q30_wind_vs_carbon_error), not here. Private view.
    columns:
      - name: settlement_date
        description: British local time, from the outturn.
      - name: settlement_period
        description: Settlement period, 1 to 46/48/50, from the outturn.
      - name: start_time
        description: Start of the half-hour, UTC. The key.
        data_tests: [unique, not_null]
      - name: outturn_published_at
        description: When the first outturn publication for the half-hour was published.
      - name: outturn_mw
        description: Wind generation in that first publication, MW.
      - name: forecast_published_at
        description: >
          The source publish-time stamp of the chosen issue: the latest stamp
          before start_time (in summer the stamp may show UK clock time). Null
          when no issue precedes the half-hour.
      - name: forecast_mw
        description: >
          The chosen issue's point for the hour containing start_time, MW.
          Null when there is no issue, or when that issue holds no point for
          the hour.
      - name: delivered_wind_error_mw
        description: >
          outturn_mw minus forecast_mw, the delivered outturn's error.
          Negative means less wind than forecast. Null when there is no
          forecast.

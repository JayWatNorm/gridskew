models:
  - name: int_elexon__bm_units_current
    description: >
      One row per National Grid BM-unit ID in the latest complete extract.
      Multiple EICs become a sorted set; other attributes must agree or the
      unique-key test fails. This is observed current state, not history before
      collection began.
    columns:
      - name: national_grid_bm_unit
        description: Current BM-unit grain and dbt snapshot key.
        data_tests: [unique, not_null]
      - name: elexon_bm_unit
        description: Nullable Elexon identifier.
      - name: eics
        description: Sorted distinct EICs from all rows for this unit.
      - name: fuel_type
        description: Nullable published code, with unknowns preserved.
      - name: source_row_count
        description: Number of source rows contributing to this unit.

  - name: int_elexon__b1610_period
    description: >
      Private incremental table. One row per B1610 BM unit and settlement
      period, with the first captured and the latest settlement-run value.
      "First captured" is the earliest retrieved_at (ties broken by run
      order): it is first observed, not the lowest run now available. Live
      dates normally start at II; backfilled dates start at SF or later, so a
      consumer must filter or label on first_run_code before it treats a
      first value as II. "Latest" is the highest run_order in the settlement-run seed. Each
      run recomputes only periods with a source row captured since the stored
      watermark minus capture_margin; this equals a full rebuild while every
      new raw row becomes visible within the margin. After a manual load, a
      raw edit, a seed change or a logic change, run
      `--select int_elexon__b1610_period+ --full-refresh`. Registry evidence
      is attached in fct_generation.
    columns:
      - name: bm_unit
        description: Elexon BM-unit identifier from B1610. Part of the key.
      - name: settlement_date
        description: Settlement date, British local time. Part of the key.
      - name: settlement_period
        description: Settlement period, 1 to 46/48/50. Part of the key.
      - name: first_quantity_mwh
        description: MWh from the earliest captured run. Never an invented II.
      - name: first_run_code
        description: Run code of the first captured value (II, SF, R1 ...).
      - name: first_retrieved_at
        description: When the first captured run was first seen.
      - name: first_source_national_grid_bm_unit_id
        description: National Grid ID delivered with the first captured run.
      - name: latest_quantity_mwh
        description: MWh from the highest-ordered run captured so far.
      - name: latest_run_code
        description: Run code of the latest value.
      - name: latest_retrieved_at
        description: When the latest run was first seen.
      - name: latest_source_national_grid_bm_unit_id
        description: National Grid ID delivered with the latest run.
      - name: last_captured_at
        description: >
          Latest retrieved_at over all runs of the period; the source of the
          incremental watermark.

  - name: int_elexon__pn_period_mwh
    description: >
      Private incremental table. One row per PN National Grid BM unit and
      settlement period, integrated to MWh from one capture. The chosen
      capture is the latest one that is not an echo: an echo only repeats
      segments already captured for that period (the next day's poll re-sends
      the segment touching its requested start). Segments are never mixed
      across captures. The capture must cover the period exactly once: a
      segment outside the period or with no duration makes it invalid; a gap,
      overlap or missing edge makes it incomplete. Both keep the row with a
      NULL pn_mwh. A unit-period with no PN has no row; absence is never zero.
      This is the latest captured PN, not the state at gate closure. The
      incremental rule and full-refresh cases match int_elexon__b1610_period.
      Registry evidence is attached in fct_commitments.
    columns:
      - name: national_grid_bm_unit
        description: National Grid BM-unit identifier from PN. Part of the key.
      - name: settlement_date
        description: Settlement date, British local time. Part of the key.
      - name: settlement_period
        description: Settlement period, 1 to 46/48/50. Part of the key.
      - name: pn_mwh
        description: >
          Sum of segment trapezoids, (MW at start + MW at end) / 2 x hours, in
          numeric. NULL unless coverage_status is complete.
      - name: coverage_status
        description: >
          complete, incomplete (gap, overlap or missing edge) or invalid (a
          segment outside the period, a segment with no duration, or a period
          number that does not exist on that date).
      - name: segment_count
        description: Number of segments in the chosen capture.
      - name: pn_retrieved_at
        description: When the chosen capture was polled.
      - name: source_bm_unit
        description: Elexon ID delivered with the PN; null for 1.4% of rows.
      - name: has_conflicting_source_bm_units
        description: >
          True when the chosen capture's segments carry more than one Elexon
          ID; fct_commitments then reports a mapping conflict.
      - name: last_captured_at
        description: >
          Latest retrieved_at over all captures of the period, echoes
          included; the source of the incremental watermark.

  - name: int_elexon__boa_by_period
    description: >
      Private view. One row per unit, acceptance, ramp point and settlement
      half-hour that the ramp point overlaps, from the latest capture of each
      ramp point. An acceptance level is the absolute MW the system operator
      instructed the unit to follow; it is not a change from the notified
      level. Acceptances of one unit overlap in time: a later acceptance
      replaces an earlier one for the minutes they share, so summing
      instructed_mwh across acceptances counts those minutes more than once.
      A model that needs one instructed level per half-hour must first choose
      the acceptance in force. A unit and half-hour with no acceptance has no
      row; absence is not zero. Every acceptance observed so far is an
      original (amendment_flag ORI). A later capture that gives a ramp point
      the same start replaces it; one that removes a ramp point or moves its
      start leaves the old point in place. Check how amendments arrive
      before this view feeds an analysis.
    columns:
      - name: national_grid_bm_unit
        description: National Grid BM-unit identifier. Part of the grain.
      - name: bm_unit
        description: Elexon identifier delivered with the acceptance.
      - name: acceptance_number
        description: >
          Identifies an acceptance for one unit; two units can hold the same
          number. Part of the grain.
      - name: acceptance_time
        description: When the system operator issued the acceptance, UTC.
      - name: period_start_utc
        description: UTC start of the settlement half-hour. Part of the grain.
      - name: ramp_point_time_from
        description: Start of the source ramp point, UTC. Part of the grain.
      - name: covered_from
        description: Start of the part of the ramp point inside the half-hour.
      - name: covered_to
        description: End of the part of the ramp point inside the half-hour.
      - name: instructed_mwh
        description: >
          Energy of the instructed level between covered_from and covered_to:
          the mean of the MW at the two ends times the hours, rounded to six
          decimal places. Negative when the instructed level is an import.
      - name: so_flag
        description: >
          Believed to mark an action taken for system reasons. The API does
          not document it.
      - name: retrieved_at
        description: When the chosen capture of the ramp point was polled.

name: 'gridskew'
version: '1.0.0'

profile: 'gridskew'

target-path: "{{ env_var('DBT_TARGET_PATH', 'target') }}"
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# The reading rule for the forecast drift question
# (docs/carbon-forecast-trajectory.md). The values are fixed before any drift
# result is read.
vars:
  forecast_full_poll_rows: 96
  forecast_no_change_run_polls: 4
  forecast_trajectory_min_slots: 90
  forecast_trajectory_first_horizon_hours: 47
  forecast_trajectory_final_horizon_hours: 0.5
  # The Q6 population starts with notices first stored on or after this
  # date; earlier "first" publications are often later revisions of notices
  # published before the REMIT history began (22 August 2024).
  remit_q6_first_publication_from: '2024-11-01 00:00:00+00'
  # How long record_run_results keeps a node result.
  node_results_retention_days: 180

# Writes nothing unless the invocation passes --vars '{audit: true}'.
on-run-end:
  - "{{ record_run_results(results) }}"

models:
  gridskew:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: view

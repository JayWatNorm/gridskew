name: 'gridskew'
version: '1.0.0'

profile: 'gridskew'

packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # The reading rule for the forecast drift question
  # (docs/carbon-forecast-trajectory.md). The values are fixed before any
  # drift result is read.
  forecast_full_poll_rows: 96
  forecast_no_change_run_polls: 4
  forecast_trajectory_min_slots: 90
  forecast_trajectory_first_horizon_hours: 47
  forecast_trajectory_final_horizon_hours: 0.5
  # The drift population: half-hours from this start, read once it holds
  # this many complete half-hours (60 days). Part of the same reading rule.
  forecast_drift_population_from: '2026-08-17 00:00:00+00'
  forecast_drift_half_hours_needed: 2880
  # The analyses leave out half-hours that start after this time (Q6: notices
  # first published after it), so a one-look result can be reproduced. Null
  # reads all stored history.
  analysis_read_until: null
  # The Q6 population starts with notices first stored on or after this
  # date; earlier "first" publications are often later revisions of notices
  # published before the REMIT history began (22 August 2024).
  remit_q6_first_publication_from: '2024-11-01 00:00:00+00'
  # Q10's settlement-date split: bank holidays in England and Wales, from
  # GOV.UK's bank-holidays.json (Open Government Licence), read 21 October 2026.
  bank_holidays_england_and_wales:
    - '2025-08-25'
    - '2025-12-25'
    - '2025-12-26'
    - '2026-01-01'
    - '2026-04-03'
    - '2026-04-06'
    - '2026-05-04'
    - '2026-05-25'
    - '2026-08-31'
    - '2026-12-25'
    - '2026-12-28'
    - '2027-01-01'
    - '2027-03-26'
    - '2027-03-29'
    - '2027-05-03'
    - '2027-05-31'
    - '2027-08-30'
    - '2027-12-27'
    - '2027-12-28'
    - '2028-01-03'
    - '2028-04-14'
    - '2028-04-17'
    - '2028-05-01'
    - '2028-05-29'
    - '2028-08-28'
    - '2028-12-25'
    - '2028-12-26'
  # Q4 is read once, on the first day it holds this many matched days.
  shortfall_error_matched_days_needed: 90
  # Q4's bootstrap interval needs this many of its 1,000 draws to form a ratio.
  shortfall_error_bootstrap_min_usable_draws: 900
  # Q8 and Q28 read one fixed window of history: settlement dates from and
  # until these, both included, ending the day before the forecast archive
  # starts. Each bootstrap interval needs this many of its 1,000 draws.
  demand_history_from: '2025-08-22'
  demand_history_until: '2026-08-16'
  demand_history_bootstrap_min_usable_draws: 900
  # Q2-RF is read once, when this many settlement dates hold RF and R3.
  rf_restatement_dates_needed: 30
  # Q27 (forecast stalls) counts slot polls from this start and is read once
  # the window holds this many days. The exploratory window is the stalls
  # seen before the question was registered, reported apart.
  forecast_stalls_from: '2026-11-01 00:00:00+00'
  forecast_stalls_days_needed: 90
  forecast_stalls_exploratory_from: '2026-10-01 00:00:00+00'
  forecast_stalls_exploratory_until: '2026-10-24 23:30:00+00'
  # How long record_run_results keeps a node result.
  node_results_retention_days: 180

# Writes nothing unless the invocation passes --vars '{audit: true}'.
on-run-end:
  - "{{ record_run_results(results) }}"

models:
  gridskew:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: view

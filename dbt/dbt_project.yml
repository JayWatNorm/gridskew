name: 'gridskew'
version: '1.0.0'

profile: 'gridskew'

target-path: "{{ env_var('DBT_TARGET_PATH', 'target') }}"
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# The reading rule for the forecast drift question
# (docs/carbon-forecast-trajectory.md). The values are fixed before any drift
# result is read.
vars:
  forecast_full_poll_rows: 96
  forecast_no_change_run_polls: 4
  forecast_trajectory_min_slots: 90
  forecast_trajectory_first_horizon_hours: 47
  forecast_trajectory_final_horizon_hours: 0.5

models:
  gridskew:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: view

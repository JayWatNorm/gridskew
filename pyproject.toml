[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "TID251"]

# dbt-postgres keeps psycopg2 installed, so an import of it would still work.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"psycopg2".msg = "Use psycopg (version 3); psycopg2 is installed only for dbt-postgres."

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/adhoc holds scripts run on their own: live-API explorations, some of
# which make requests at import time, and checks that write to a disposable
# database. Keep pytest out of it, so a file there named test_*.py is never
# collected, in CI or locally.
norecursedirs = ["adhoc"]

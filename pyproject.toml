[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "TID251"]

# dbt-postgres keeps psycopg2 installed, so an import of it would still work.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"psycopg2".msg = "Use psycopg (version 3); psycopg2 is installed only for dbt-postgres."

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/adhoc holds exploratory scripts that call the live API at import time.
# Without this, one file named test_*.py in there would make real HTTP requests
# during collection - including in CI.
norecursedirs = ["adhoc"]

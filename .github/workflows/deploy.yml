name: CD - Deploy to Homelab

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Pull & Verify on Homelab
    runs-on: self-hosted

    steps:
      - name: Fast-forward pull repositories
        run: |
          echo "Updating GridSkew checkout on homelab..."
          cd /home/jwatling/gridskew
          git pull --ff-only

          echo "Updating Homelab Platform checkout on homelab..."
          cd /home/jwatling/homelab-platform
          git pull --ff-only

      - name: Verify Airflow DAG parsing
        run: |
          echo "Checking Airflow for DAG import errors..."
          cd /home/jwatling/homelab-platform
          docker compose exec -T airflow airflow dags list-import-errors

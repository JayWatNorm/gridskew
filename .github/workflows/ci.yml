name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A main run is never cancelled: a release needs a completed run for its SHA.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The CI database; every step that reaches it reads these.
    env:
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: postgres
      DBT_PASSWORD: password
      DBT_DBNAME: gridskew_dev

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gridskew_dev

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Check DAG files compile
        run: python -m compileall -q dags/

      - name: Apply raw migrations with Flyway
        run: >
          docker run --rm --network host
          -v "${{ github.workspace }}/sql/migrations:/flyway/sql:ro"
          flyway/flyway:13.8.0
          -url=jdbc:postgresql://localhost:5432/gridskew_dev
          -user=postgres -password=password
          -schemas=raw -locations=filesystem:/flyway/sql
          migrate

      - name: Load disposable CI fixtures
        env:
          PYTHONPATH: .
          GRIDSKEW_DISPOSABLE_TEST: "1"
        run: python -m tests.adhoc.load_ci_fixtures

      - name: Run dbt commands
        env:
          DBT_PROFILES_DIR: dbt_profiles
        run: |
          dbt parse --project-dir dbt
          dbt build --project-dir dbt

      - name: Check scheduled dbt jobs cannot replace a relation
        env:
          PYTHONPATH: .
        run: python tests/adhoc/check_scheduled_set.py dbt/target/manifest.json

      - name: Check BM-unit snapshot lifecycle
        env:
          PYTHONPATH: .
          GRIDSKEW_DISPOSABLE_TEST: "1"
          DBT_PROFILES_DIR: dbt_profiles
        run: python tests/adhoc/check_bmu_snapshot_lifecycle.py

      - name: Check outturn gap re-fetch queries
        env:
          PYTHONPATH: .
          GRIDSKEW_DISPOSABLE_TEST: "1"
        run: python tests/adhoc/check_outturn_gap_refetch.py

      - name: Run the nightly dbt commands and check their audit rows
        env:
          PYTHONPATH: .
          GRIDSKEW_DISPOSABLE_TEST: "1"
          DBT_PROFILES_DIR: dbt_profiles
        run: python tests/adhoc/check_nightly_run.py

      - name: Run every analysis against the fixtures
        env:
          PYTHONPATH: .
          GRIDSKEW_DISPOSABLE_TEST: "1"
        run: python -m tests.adhoc.check_analyses_compile

      - name: Check the one-look analyses on worked values
        env:
          PYTHONPATH: .
          GRIDSKEW_DISPOSABLE_TEST: "1"
        run: python -m tests.adhoc.check_one_look_analyses

      # After every step that reads the fixtures: the loaders it calls commit,
      # and no later step should read the rows it writes (it deletes them at
      # the end).
      - name: Read back what the loaders and the quarantine write
        env:
          PYTHONPATH: .
          GRIDSKEW_DISPOSABLE_TEST: "1"
        run: python -m tests.adhoc.check_database_writes

      # Pages, value types, ignored repeats and rollback of the shared insert
      # helper; it creates and drops its own schema.
      - name: Check the shared insert helper on the database
        env:
          PYTHONPATH: .
          GRIDSKEW_DISPOSABLE_TEST: "1"
        run: python -m tests.adhoc.check_insert_rows

  # These checks assert that their tables start empty, so they run in their
  # own job against a database that holds no CI fixtures.
  period-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The CI database; every step that reaches it reads these.
    env:
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: postgres
      DBT_PASSWORD: password
      DBT_DBNAME: gridskew_dev

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gridskew_dev

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements-dev.txt

      - name: Apply raw migrations with Flyway
        run: >
          docker run --rm --network host
          -v "${{ github.workspace }}/sql/migrations:/flyway/sql:ro"
          flyway/flyway:13.8.0
          -url=jdbc:postgresql://localhost:5432/gridskew_dev
          -user=postgres -password=password
          -schemas=raw -locations=filesystem:/flyway/sql
          migrate

      - name: Check the period tables and fact views
        env:
          GRIDSKEW_DISPOSABLE_TEST: "1"
        run: python -m tests.adhoc.check_period_tables

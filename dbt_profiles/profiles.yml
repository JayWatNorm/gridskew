# Local development. The Airflow deployment keeps its own profile in the
# platform repository.
#
# Points at the production database on purpose: the development database
# holds only test loads, and models need real data. Safety comes from the
# role: gridskew_dbt can read raw and owns dbt_dev, nothing more.
gridskew:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT') | as_number }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'gridskew_prod') }}"
      schema: dbt_dev
      threads: 4